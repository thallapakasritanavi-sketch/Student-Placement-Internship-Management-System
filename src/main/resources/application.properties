server.port=${PORT:8080}
server.address=0.0.0.0

# Spring Application Name
spring.application.name=student-placement-management-system

# MySQL Database Configuration (Supports Local, Railway, Render, Docker & Environment Overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:${DB_HOST:localhost}}:${MYSQLPORT:${DB_PORT:3306}}/${MYSQLDATABASE:${DB_NAME:student_placement_db}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${DB_USERNAME:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${DB_PASSWORD:lucky}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.sritanavi.placement=INFO
logging.level.org.springframework.web=INFO

# H2 Console — disabled in production (enabled only in application-h2.properties)
spring.h2.console.enabled=false

# Session security — SameSite=Strict prevents CSRF for same-site requests
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
# SECURE_COOKIE defaults to false for local HTTP dev.
# On Railway, set environment variable: SECURE_COOKIE=true
# (Railway always serves HTTPS so the browser requires Secure cookies)
server.servlet.session.cookie.secure=${SECURE_COOKIE:false}

# Spring Boot Actuator — Health check only (used by Railway health probes)
# /actuator/health returns {"status":"UP"} when DB connection is healthy
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Admin Account Configuration
# Configurable via environment variables (ADMIN_NAME, ADMIN_EMAIL, ADMIN_PASSWORD)
# On Render: configure ADMIN_PASSWORD in Render Web Service -> Environment Variables for private security.
app.admin.name=${ADMIN_NAME:Sri Tanavi}
app.admin.email=${ADMIN_EMAIL:sri}
app.admin.password=${ADMIN_PASSWORD:admin123}
