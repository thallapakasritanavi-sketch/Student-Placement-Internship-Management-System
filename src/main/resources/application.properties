server.port=${PORT:8080}
server.address=0.0.0.0

# Spring Application Name
spring.application.name=student-placement-management-system

# MySQL Database Configuration (Supports Local, Railway, Render, Docker & Environment Overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:${DB_HOST:localhost}}:${MYSQLPORT:${DB_PORT:3306}}/${MYSQLDATABASE:${DB_NAME:student_placement_db}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${DB_USERNAME:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${DB_PASSWORD:lucky}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.sritanavi.placement=INFO
logging.level.org.springframework.web=INFO

# H2 Console — disabled in production (enabled only in application-h2.properties)
spring.h2.console.enabled=false

# Session security — SameSite=Strict prevents CSRF for same-site requests
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
# In production Railway uses HTTPS so enable secure cookie; locally it's fine without
server.servlet.session.cookie.secure=false
