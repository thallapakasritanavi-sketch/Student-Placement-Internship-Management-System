<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Placement & Internship Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="text-center mb-4">
                    <a href="/" class="brand-logo justify-content-center text-decoration-none">
                        <i class="bi bi-mortarboard-fill"></i> PlacementHub
                    </a>
                    <h4 class="fw-bold mt-2">Sign in to your account</h4>
                    <p class="text-muted small">Access your placement dashboard and applications</p>
                </div>

                <div class="card app-card p-4 shadow">
                    <!-- Quick Demo Fill Buttons -->
                    <div class="alert alert-info py-2 px-3 mb-3 small">
                        <strong><i class="bi bi-lightning-charge-fill text-warning"></i> Quick Demo Login:</strong>
                        <div class="d-flex gap-2 mt-2">
                            <button type="button" class="btn btn-sm btn-outline-primary flex-fill" onclick="fillDemo('student')">
                                <i class="bi bi-person"></i> Student Demo
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-dark flex-fill" onclick="fillDemo('admin')">
                                <i class="bi bi-shield-lock"></i> Admin Demo
                            </button>
                        </div>
                    </div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" required placeholder="name@placement.com">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" required placeholder="••••••••">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-submit">
                            <span id="btn-text"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top small">
                        <p class="mb-1 text-muted">Don't have an account? <a href="/register.html" class="fw-semibold text-primary">Register here</a></p>
                        <a href="/" class="text-secondary"><i class="bi bi-arrow-left"></i> Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        function fillDemo(type) {
            if (type === 'admin') {
                document.getElementById('email').value = 'admin@placement.com';
                document.getElementById('password').value = 'admin123';
            } else {
                document.getElementById('email').value = 'student@placement.com';
                document.getElementById('password').value = 'student123';
            }
        }

        // Auto-check URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('role') === 'ADMIN') {
            fillDemo('admin');
        } else if (urlParams.get('role') === 'STUDENT') {
            fillDemo('student');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            btn.disabled = true;
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');

            try {
                const res = await API.login(email, password);
                if (res.success && res.data) {
                    API.showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        if (res.data.role === 'ADMIN') {
                            window.location.href = '/admin-dashboard.html';
                        } else if (res.data.role === 'RECRUITER') {
                            window.location.href = '/recruiter-dashboard.html';
                        } else {
                            window.location.href = '/student-dashboard.html';
                        }
                    }, 600);
                }
            } catch (err) {
                btn.disabled = false;
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
