<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Placement & Internship Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="text-center mb-4">
                    <a href="/" class="brand-logo justify-content-center text-decoration-none">
                        <i class="bi bi-mortarboard-fill"></i> PlacementHub
                    </a>
                    <h4 class="fw-bold mt-2">Create New Account</h4>
                    <p class="text-muted small">Join your campus recruitment and placement network</p>
                </div>

                <div class="card app-card p-4 shadow">
                    <!-- Role Toggle Buttons -->
                    <div class="d-flex mb-4 bg-light p-1 rounded">
                        <button type="button" class="btn btn-primary flex-fill fw-semibold" id="tab-student" onclick="setRole('STUDENT')">
                            <i class="bi bi-mortarboard me-1"></i> Student Registration
                        </button>
                        <button type="button" class="btn btn-light flex-fill fw-semibold text-secondary" id="tab-recruiter" onclick="setRole('RECRUITER')">
                            <i class="bi bi-building me-1"></i> Recruiter Registration
                        </button>
                    </div>

                    <form id="register-form">
                        <input type="hidden" id="role" value="STUDENT">

                        <!-- Basic Information -->
                        <h6 class="fw-bold text-primary mb-3"><i class="bi bi-person-lines-fill me-1"></i> Basic Details</h6>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name *</label>
                                <input type="text" class="form-control" id="fullName" required placeholder="John Doe">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address *</label>
                                <input type="email" class="form-control" id="email" required placeholder="john@example.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Password *</label>
                                <input type="password" class="form-control" id="password" required minlength="6" placeholder="Min 6 characters">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" placeholder="+91 9876543210">
                            </div>
                        </div>

                        <!-- Student Section -->
                        <div id="student-fields">
                            <h6 class="fw-bold text-primary mb-3 pt-2 border-top"><i class="bi bi-book me-1"></i> Academic Information</h6>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">College / Institute</label>
                                    <input type="text" class="form-control" id="college" placeholder="National Institute of Tech">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Degree</label>
                                    <select class="form-select" id="degree">
                                        <option value="B.Tech" selected>B.Tech</option>
                                        <option value="B.E.">B.E.</option>
                                        <option value="M.Tech">M.Tech</option>
                                        <option value="MCA">MCA</option>
                                        <option value="B.Sc">B.Sc</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Department</label>
                                    <input type="text" class="form-control" id="department" placeholder="Computer Science & Engg">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Graduation Year</label>
                                    <input type="number" class="form-control" id="graduationYear" value="2026" min="2020" max="2030">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">CGPA</label>
                                    <input type="number" step="0.01" class="form-control" id="cgpa" placeholder="8.5" min="0" max="10">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Key Technical Skills</label>
                                    <input type="text" class="form-control" id="skills" placeholder="Java, Spring Boot, MySQL, HTML, CSS, JavaScript">
                                    <div class="form-text">Comma-separated skills to match with job requirements</div>
                                </div>
                            </div>
                        </div>

                        <!-- Recruiter Section -->
                        <div id="recruiter-fields" class="d-none">
                            <h6 class="fw-bold text-primary mb-3 pt-2 border-top"><i class="bi bi-building-gear me-1"></i> Company Information</h6>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Company Name *</label>
                                    <input type="text" class="form-control" id="companyName" placeholder="Acme Technologies">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Company Website</label>
                                    <input type="url" class="form-control" id="companyWebsite" placeholder="https://acme.example.com">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Company Description</label>
                                    <textarea class="form-control" id="companyDescription" rows="2" placeholder="Brief about your company & domains..."></textarea>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-3" id="btn-submit">
                            <span id="btn-text"><i class="bi bi-check-circle me-1"></i> Complete Registration</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top small">
                        <p class="mb-1 text-muted">Already registered? <a href="/login.html" class="fw-semibold text-primary">Sign in here</a></p>
                        <a href="/" class="text-secondary"><i class="bi bi-arrow-left"></i> Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        function setRole(role) {
            document.getElementById('role').value = role;
            if (role === 'STUDENT') {
                document.getElementById('tab-student').className = 'btn btn-primary flex-fill fw-semibold';
                document.getElementById('tab-recruiter').className = 'btn btn-light flex-fill fw-semibold text-secondary';
                document.getElementById('student-fields').classList.remove('d-none');
                document.getElementById('recruiter-fields').classList.add('d-none');
            } else {
                document.getElementById('tab-recruiter').className = 'btn btn-primary flex-fill fw-semibold';
                document.getElementById('tab-student').className = 'btn btn-light flex-fill fw-semibold text-secondary';
                document.getElementById('student-fields').classList.add('d-none');
                document.getElementById('recruiter-fields').classList.remove('d-none');
            }
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const data = {
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value.trim(),
                role: role
            };

            if (role === 'STUDENT') {
                data.college = document.getElementById('college').value.trim();
                data.degree = document.getElementById('degree').value;
                data.department = document.getElementById('department').value.trim();
                data.graduationYear = parseInt(document.getElementById('graduationYear').value) || null;
                data.cgpa = parseFloat(document.getElementById('cgpa').value) || null;
                data.skills = document.getElementById('skills').value.trim();
            } else {
                data.companyName = document.getElementById('companyName').value.trim();
                data.companyWebsite = document.getElementById('companyWebsite').value.trim();
                data.companyDescription = document.getElementById('companyDescription').value.trim();
            }

            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            btn.disabled = true;
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');

            try {
                const res = await API.register(data);
                if (res.success && res.data) {
                    API.showToast('Registration successful! Redirecting to dashboard...', 'success');
                    setTimeout(() => {
                        if (res.data.role === 'ADMIN') window.location.href = '/admin-dashboard.html';
                        else if (res.data.role === 'RECRUITER') window.location.href = '/recruiter-dashboard.html';
                        else window.location.href = '/student-dashboard.html';
                    }, 800);
                }
            } catch (err) {
                btn.disabled = false;
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
